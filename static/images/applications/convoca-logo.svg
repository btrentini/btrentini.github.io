<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Convoca research mark</title>
  <desc id="desc">Brazil 2026 squad radar logo using Brazilian green, yellow, and blue with a coach-board silhouette and Bayesian network nodes.</desc>
  <defs>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b4f36"/>
      <stop offset="1" stop-color="#1f7a4b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="1" stop-color="#f4cf42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#0b1d12" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="720" height="220" rx="24" fill="#f7f7f2"/>
  <g transform="translate(26 28)" filter="url(#shadow)">
    <rect width="164" height="164" rx="22" fill="url(#field)"/>
    <path d="M82 18 148 82 82 146 16 82Z" fill="url(#paper)"/>
    <circle cx="82" cy="82" r="34" fill="#154996"/>
    <path d="M35 121c21-22 48-29 77-20" fill="none" stroke="#f7f7f2" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 73c8-22 24-36 47-42" fill="none" stroke="#f7f7f2" stroke-width="7" stroke-linecap="round"/>
    <path d="M71 74h20m14 0h18" stroke="#f7f7f2" stroke-width="5" stroke-linecap="round"/>
    <path d="M91 74c5 4 9 4 14 0" fill="none" stroke="#f7f7f2" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 110h48" stroke="#0b4f36" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="124" r="7" fill="#0b4f36"/>
    <circle cx="82" cy="108" r="7" fill="#0b4f36"/>
    <circle cx="118" cy="119" r="7" fill="#0b4f36"/>
    <path d="M57 121 76 111m13-1 22 7" stroke="#0b4f36" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(222 45)">
    <text x="0" y="32" fill="#14341f" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700">Convoca</text>
    <text x="1" y="68" fill="#2f6f49" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">BRAZIL 2026 SQUAD RADAR</text>
    <text x="0" y="111" fill="#475446" font-family="Arial, Helvetica, sans-serif" font-size="19">Probabilities, fan choices, and transparent</text>
    <text x="0" y="139" fill="#475446" font-family="Arial, Helvetica, sans-serif" font-size="19">Bayesian diagnostics for the Selecao race.</text>
  </g>
</svg>

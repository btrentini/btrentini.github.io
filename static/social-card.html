<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>Bruno Trentini social card</title>
  <style>
    @font-face{font-family:Plex;src:url("fonts/plex-sans-regular.woff2") format("woff2");font-weight:400}
    @font-face{font-family:Plex;src:url("fonts/plex-sans-semibold.woff2") format("woff2");font-weight:600}
    *{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{background:#f5f3ee;color:#1b232b;font-family:Plex,sans-serif}
    main{position:relative;display:grid;grid-template-columns:1fr 312px;gap:72px;width:100%;height:100%;padding:72px 78px 64px;align-items:center}
    main:before{position:absolute;right:0;bottom:0;left:0;height:9px;background:#9a4f2e;content:""}
    .mark{display:grid;width:42px;height:42px;margin-bottom:46px;border:2px solid #9a4f2e;grid-template:1fr 1fr/1fr 1fr;padding:7px}.mark i:first-child{background:#9a4f2e;grid-column:2}.mark i:last-child{background:#9a4f2e;grid-row:2}
    h1{margin:0 0 22px;font-size:72px;font-weight:600;letter-spacing:-3px;line-height:.98}
    p{max-width:720px;margin:0;color:#52606b;font-size:30px;line-height:1.3}
    .fields{display:flex;gap:16px;margin-top:42px;color:#773a22;font-size:18px}.fields span+span:before{margin-right:16px;color:#b9b6af;content:"/"}
    img{width:312px;height:390px;border:1px solid #d8d5ce;object-fit:cover;object-position:center 36%;filter:saturate(.86) contrast(1.02)}
  </style>
</head>
<body><main><div><div class="mark" aria-hidden="true"><i></i><i></i></div><h1>Bruno Trentini</h1><p>Applied machine learning research and technical leadership.</p><div class="fields"><span>Generative models</span><span>Geometric learning</span><span>GPU systems</span></div></div><img src="images/profile/bruno-trentini-applied-ml-researcher.webp" alt="" /></main></body>
</html>
